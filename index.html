<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiesta Alquimia — Vivamos el momento, disfrutemos cada encuentro ;)</title>
  <meta name="description" content="Web oficial de Fiesta Alquimia. Fechas, destinos, entradas oficiales y fotos de cada joda.">
  
  <!-- Open Graph / Meta estático por defecto -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fiestaalquimia.netlify.app/">
  <meta property="og:title" content="Fiesta Alquimia">
  <meta property="og:description" content="Vivamos el momento, disfrutemos cada encuentro ;) · Entradas e info oficial">
  <meta property="og:image" content="https://riwaytrjxkbpdkkpvxvx.supabase.co/storage/v1/object/public/alquimia-media/og-default.jpg">
  
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fiesta Alquimia">
  <meta name="twitter:description" content="Vivamos el momento, disfrutemos cada encuentro ;) · Entradas e info oficial">
  <meta name="twitter:image" content="https://riwaytrjxkbpdkkpvxvx.supabase.co/storage/v1/object/public/alquimia-media/og-default.jpg">

  <!-- Google Fonts: Anton & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #0A0A0A;
      --bg-card: #121212;
      --bg-card-hover: #171717;
      --red-main: #D32F2F;
      --red-bright: #E53935;
      --red-dark: #7A0C12;
      --white: #FFFFFF;
      --gray-light: #B5B5B5;
      --gray-dark: #222222;
      --gray-border: rgba(255, 255, 255, 0.12);
      --font-display: 'Anton', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace, monospace;
      --radius: 4px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--white);
      font-family: var(--font-body);
      min-height: 100vh;
      line-height: 1.5;
      position: relative;
      overflow-x: hidden;
      background-image: radial-gradient(circle at 50% 0%, rgba(122, 12, 18, 0.35) 0%, rgba(10, 10, 10, 0.98) 70%);
      background-repeat: no-repeat;
    }

    /* Fondo dinámico configurable vía site_settings */
    #custom-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: none;
    }
    #custom-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.78);
      backdrop-filter: blur(2px);
    }

    /* Grano / ruido sobre toda la página */
    .grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.08;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Layout container */
    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header / Hero */
    .hero {
      padding: 40px 16px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .hero-logo-box {
      width: 72px;
      height: 72px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
    }

    .hero-logo-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .hero-logo-svg {
      width: 100%;
      height: 100%;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 9vw, 4.2rem);
      letter-spacing: 2px;
      line-height: 0.95;
      text-transform: uppercase;
      color: var(--white);
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .hero-tagline {
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      color: var(--gray-light);
      max-width: 480px;
      margin: 0 auto 16px;
      font-style: italic;
    }

    .hero-ig-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--white);
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
      text-decoration: none;
      transition: background-color 0.2s, border-color 0.2s, transform 0.15s;
    }
    .hero-ig-btn:hover {
      background-color: rgba(211, 47, 47, 0.2);
      border-color: var(--red-main);
      transform: translateY(-1px);
    }
    .hero-ig-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Secciones */
    section {
      padding: 24px 0 40px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--red-dark);
      padding-bottom: 8px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--white);
    }

    .group-header {
      margin: 32px 0 16px;
      padding: 6px 12px;
      background: linear-gradient(90deg, rgba(122, 12, 18, 0.7), transparent);
      border-left: 4px solid var(--red-main);
      font-family: var(--font-display);
      font-size: 1.3rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--white);
    }

    /* Grid de jodas */
    .events-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }

    @media (min-width: 768px) {
      .events-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Card de joda */
    .event-card {
      background-color: var(--bg-card);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
    }
    .event-card:hover {
      border-color: rgba(211, 47, 47, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* Flyer container */
    .card-flyer-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: var(--bg-dark);
      overflow: hidden;
    }

    .card-flyer-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .event-card:hover .card-flyer-img {
      transform: scale(1.03);
    }

    /* Flyer fallback con logo marca de agua */
    .card-flyer-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #7A0C12 0%, #150204 100%);
      color: rgba(255, 255, 255, 0.15);
      position: relative;
    }
    .card-flyer-placeholder svg {
      width: 50%;
      height: 50%;
    }

    /* Gradient overlay sobre flyer */
    .card-flyer-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(18,18,18,0.95) 100%);
      pointer-events: none;
    }

    /* Fecha destacada sobre el flyer */
    .card-date-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: var(--red-main);
      color: var(--white);
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: var(--radius);
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    .card-time-badge {
      font-size: 0.8rem;
      font-family: var(--font-body);
      font-weight: 700;
      margin-left: 4px;
      opacity: 0.9;
    }

    /* Card Content */
    .card-body {
      padding: 18px 16px 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 14px;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      line-height: 1.05;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--white);
    }

    /* Tablero de Destino tipo Split-Flap (§6) */
    .flap-board-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .flap-board-label {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--gray-light);
      text-transform: uppercase;
    }

    .flap-board {
      display: flex;
      gap: 3px;
      background: #000;
      padding: 6px;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow-x: auto;
      max-width: 100%;
    }

    .flap-cell {
      width: 22px;
      height: 32px;
      background: #181818;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      color: var(--white);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      text-transform: uppercase;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.8);
    }

    /* Línea divisoria en el medio de la ficha */
    .flap-cell::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: rgba(0, 0, 0, 0.85);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .flap-cell.empty {
      background: #101010;
    }

    /* Información de venue y lineup */
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--gray-light);
    }

    .card-venue {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--white);
      font-weight: 600;
    }
    .card-venue svg {
      width: 14px;
      height: 14px;
      fill: var(--red-bright);
      flex-shrink: 0;
    }

    .card-lineup {
      font-size: 0.85rem;
      white-space: pre-line;
      color: #DDD;
      border-left: 2px solid var(--red-dark);
      padding-left: 8px;
      margin-top: 2px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--gray-light);
      line-height: 1.4;
    }

    /* Status Badges */
    .status-badge {
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-preparando {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--gray-light);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .status-tanda_1, .status-tanda_2 {
      background-color: rgba(211, 47, 47, 0.2);
      color: #FF6B6B;
      border: 1px solid var(--red-main);
    }

    .status-ultima_tanda {
      background-color: var(--red-main);
      color: var(--white);
      border: 1px solid #FF1744;
      animation: pulse-red 2s infinite ease-in-out;
    }

    .status-agotado {
      background-color: #202020;
      color: #777;
      border: 1px solid #333;
      text-decoration: line-through;
    }

    .status-en_curso {
      background-color: #E65100;
      color: var(--white);
      border: 1px solid #FF9800;
      animation: pulse-orange 1.5s infinite;
    }

    @keyframes pulse-red {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
    }
    @keyframes pulse-orange {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* Cuenta regresiva */
    .countdown-box {
      background-color: #080808;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      padding: 8px 12px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: #E0E0E0;
      letter-spacing: 0.5px;
    }
    .countdown-urgent {
      color: #FF5252;
      border-color: rgba(211, 47, 47, 0.4);
      background-color: rgba(211, 47, 47, 0.08);
      font-size: 1rem;
    }

    /* Botones de acción */
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
      padding-top: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      font-family: var(--font-display);
      font-size: 1.1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s, opacity 0.2s;
      min-height: 46px;
    }

    .btn-ticket {
      background-color: var(--red-main);
      color: var(--white);
      box-shadow: 0 4px 14px rgba(211, 47, 47, 0.4);
    }
    .btn-ticket:hover {
      background-color: var(--red-bright);
      transform: translateY(-1px);
    }

    .btn-disabled {
      background-color: #222;
      color: #666;
      cursor: not-allowed;
      border: 1px solid #333;
    }

    .btn-share {
      background-color: transparent;
      color: var(--white);
      border: 1px solid var(--gray-border);
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 700;
      min-height: 40px;
    }
    .btn-share:hover {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .btn-share svg {
      width: 16px;
      height: 16px;
      fill: #25D366;
    }

    .card-notice {
      font-size: 0.85rem;
      color: var(--gray-light);
      text-align: center;
      padding: 6px 0;
    }
    .card-notice a {
      color: var(--red-bright);
      text-decoration: underline;
    }

    /* Sección Fotos Pasadas */
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .photo-card {
      background-color: var(--bg-card);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .photo-flyer-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .photo-flyer-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Estado: Revelando fotos (B&W + blur oscilante) */
    .photo-card-developing .photo-flyer-img {
      filter: grayscale(100%);
      animation: blur-oscillate 5s infinite ease-in-out;
    }

    @keyframes blur-oscillate {
      0%, 100% { filter: grayscale(100%) blur(10px); }
      50% { filter: grayscale(100%) blur(4px); }
    }

    .photo-card-developing .developing-badge {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      padding: 16px;
      text-align: center;
    }

    .developing-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--white);
      margin-bottom: 4px;
    }

    .developing-subtitle {
      font-size: 0.8rem;
      color: var(--gray-light);
      font-weight: 600;
    }

    /* Estado: Fotos listas */
    .photo-card-ready {
      border: 1.5px solid var(--red-main);
      box-shadow: 0 4px 15px rgba(211, 47, 47, 0.2);
    }
    .photo-card-ready .photo-flyer-img {
      filter: none;
    }

    .photo-card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .photo-card-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      text-transform: uppercase;
      line-height: 1.1;
      color: var(--white);
    }

    .photo-card-date {
      font-size: 0.8rem;
      color: var(--gray-light);
      font-weight: 600;
    }

    .btn-drive {
      background-color: var(--red-main);
      color: var(--white);
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 10px;
      text-align: center;
      border-radius: var(--radius);
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-drive:hover {
      background-color: var(--red-bright);
    }

    .photos-more-wrap {
      text-align: center;
      margin-top: 24px;
    }

    /* Empty state & Error message */
    .empty-state {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--gray-border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .empty-state-text {
      font-size: 1.05rem;
      color: var(--gray-light);
      max-width: 360px;
    }

    .error-box {
      background: rgba(122, 12, 18, 0.4);
      border: 1px solid var(--red-main);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      margin: 20px 0;
      display: none;
    }
    .error-box-text {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #FFF;
    }
    .btn-retry {
      background: var(--red-main);
      color: var(--white);
      border: none;
      padding: 8px 18px;
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 1px;
      border-radius: var(--radius);
      cursor: pointer;
    }

    /* Skeletons */
    .skeleton-card {
      background: var(--bg-card);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 4 / 5;
      animation: pulse-skeleton 1.5s infinite ease-in-out;
    }
    @keyframes pulse-skeleton {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.3; }
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--gray-border);
      padding: 32px 16px;
      text-align: center;
      color: var(--gray-light);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 40px;
    }

    .footer-logo {
      width: 36px;
      height: 36px;
      color: var(--white);
      opacity: 0.8;
    }

    .footer-link {
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link:hover {
      color: var(--red-bright);
    }
  </style>
</head>
<body>

  <!-- Fondo configurable dinámico -->
  <div id="custom-bg"></div>

  <!-- Capa de grano constante -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <main class="container">
    
    <!-- 5.1 HERO -->
    <header class="hero" id="hero">
      <div class="hero-logo-box" id="logo-container">
        <!-- SVG Tipi Placeholder Inicial -->
        <svg class="hero-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo Fiesta Alquimia">
          <path d="M50 10L16 88H84L50 10Z" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
          <path d="M42 4L50 16L58 4" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <line x1="28" y1="56" x2="72" y2="56" stroke="currentColor" stroke-width="4"/>
          <line x1="22" y1="72" x2="78" y2="72" stroke="currentColor" stroke-width="4"/>
          <polygon points="50,65 38,88 62,88" fill="currentColor"/>
        </svg>
      </div>
      <h1 class="hero-title" id="site-title">Fiesta Alquimia</h1>

    // Formatear texto estilo flyer: "SÁB 10.10" en mayúsculas
    function formatFlyerDate(isoString) {
      try {
        const d = new Date(isoString);
        const parts = dateFormatter.formatToParts(d);
        let weekday = '';
        let day = '';
        let month = '';
        for (const p of parts) {
          if (p.type === 'weekday') weekday = p.value.replace('.', '');
          if (p.type === 'day') day = p.value;
          if (p.type === 'month') month = p.value;
        }
        return `${weekday} ${day}.${month}`.toUpperCase();
      } catch (err) {
        return '';
      }
    }

    function formatFlyerTime(isoString) {
      try {
        const d = new Date(isoString);
        return timeFormatter.format(d);
      } catch (err) {
        return '';
      }

    // Validador seguro de URLs para prevenir esquemas javascript: o ataques XSS
    function sanitizeUrl(url) {

    // Cargar eventos
    async function loadEvents() {
      if (!supabaseClient) {
        throw new Error('Supabase no inicializado');
      }

      const { data, error } = await supabaseClient
        .from('events')
        .select('*')
        .eq('published', true)
        .order('event_date', { ascending: true });

      if (error) {
        throw error;
      }

      const now = Date.now();
      const finishWindowMs = FINISH_AFTER_HOURS * 3600 * 1000;

      activeEvents = [];
      pastEvents = [];

      (data || []).forEach(evt => {
        const evtTime = new Date(evt.event_date).getTime();
        const finishTime = evtTime + finishWindowMs;

        if (now > finishTime) {
          pastEvents.push(evt);
        } else {
          activeEvents.push(evt);
        }
      });

      // Ordenar pasadas de más reciente a más antigua
      pastEvents.sort((a, b) => new Date(b.event_date).getTime() - new Date(a.event_date).getTime());

      renderUpcomingEvents(activeEvents);
      renderPastEvents(pastEvents);
      startGlobalCountdown();

    // Tablero Aeropuerto Split-Flap (§6)
    function createSplitFlapBoard(destination) {
      const board = document.createElement('div');
      board.className = 'flap-board';
      board.setAttribute('aria-label', `Destino: ${destination}`);

      const maxCells = 16;
      const targetStr = destination.padEnd(maxCells, ' ').slice(0, maxCells);
      const cellElements = [];

      for (let i = 0; i < maxCells; i++) {
        const cell = document.createElement('div');
        cell.className = 'flap-cell';
        cell.setAttribute('aria-hidden', 'true');
        cell.textContent = ' ';
        board.appendChild(cell);
        cellElements.push(cell);
      }

      // Animar con IntersectionObserver
      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            obs.unobserve(entry.target);
            animateBoard(cellElements, targetStr);
          }
        });
      }, { threshold: 0.3 });

      observer.observe(board);
      return board;
    }

    function animateBoard(cellElements, targetStr) {
      // Respetar prefers-reduced-motion (§6)
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced) {
        cellElements.forEach((cell, idx) => {
          const char = targetStr[idx] || ' ';
          cell.textContent = char;
          if (char === ' ') cell.classList.add('empty');
        });
        return;
      }

      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

      // Duración total de la revelación: ~3 segundos
      const STAGGER_MS = 100;
      const FLIP_INTERVAL_MS = 75;
      const MIN_FLIPS = 16;
      const EXTRA_FLIPS = 6;

      cellElements.forEach((cell, idx) => {
        const finalChar = targetStr[idx] || ' ';
        const delay = idx * STAGGER_MS;
        let flips = 0;
        const maxFlips = MIN_FLIPS + Math.floor(Math.random() * EXTRA_FLIPS);

        setTimeout(() => {
          const interval = setInterval(() => {
            flips++;
            if (flips >= maxFlips) {
              clearInterval(interval);
              cell.textContent = finalChar;
              if (finalChar === ' ') cell.classList.add('empty');
            } else {
              cell.textContent = chars[Math.floor(Math.random() * chars.length)];
            }
          }, FLIP_INTERVAL_MS);
        }, delay);
      });
    }

    // Cuenta regresiva única global (§8)
    function startGlobalCountdown() {
      if (countdownIntervalId) clearInterval(countdownIntervalId);

      function update() {
        const now = Date.now();
        const boxes = document.querySelectorAll('.countdown-box');

        boxes.forEach(box => {
          const dateStr = box.dataset.eventDate;
          if (!dateStr) return;

          const targetTime = new Date(dateStr).getTime();
          const diffMs = targetTime - now;
          const finishTime = targetTime + (FINISH_AFTER_HOURS * 3600 * 1000);

          if (now >= targetTime && now <= finishTime) {
            box.textContent = '¡ES HOY! 🔥 EN CURSO';
            box.classList.add('countdown-urgent');
            return;
          }

          if (diffMs <= 0) {
            box.textContent = 'FINALIZADA';
            box.classList.remove('countdown-urgent');
            return;
          }

          const totalSeconds = Math.floor(diffMs / 1000);
          const days = Math.floor(totalSeconds / 86400);
          const hours = Math.floor((totalSeconds % 86400) / 3600);
          const minutes = Math.floor((totalSeconds % 3600) / 60);
          const seconds = totalSeconds % 60;

          // Si falta menos de 24 horas, mostrar con énfasis formato HH:MM:SS
          if (days < 1) {
            const hStr = String(hours).padStart(2, '0');
            const mStr = String(minutes).padStart(2, '0');
            const sStr = String(seconds).padStart(2, '0');
            box.textContent = `FALTA: ${hStr}:${mStr}:${sStr}`;
            box.classList.add('countdown-urgent');
          } else {
            box.textContent = `${days} días · ${hours} h · ${minutes} min · ${seconds} s`;
            box.classList.remove('countdown-urgent');
          }
        });
      }

      update();
      countdownIntervalId = setInterval(update, 1000);
    }

    // Renderizar fotos pasadas (§5.3)
    function renderPastEvents(events) {
      const section = document.getElementById('fotos-section');
      const container = document.getElementById('photos-container');
      const moreWrap = document.getElementById('photos-more-wrap');

      if (!events || events.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      container.textContent = '';

      const slice = events.slice(0, pastEventsDisplayLimit);

      slice.forEach(evt => {
        const card = createPhotoCard(evt);
        container.appendChild(card);
      });

      if (events.length > pastEventsDisplayLimit) {
        moreWrap.style.display = 'block';
        const moreBtn = document.getElementById('btn-more-photos');
        moreBtn.onclick = () => {
          pastEventsDisplayLimit += 12;
          renderPastEvents(events);
        };
      } else {
        moreWrap.style.display = 'none';
      }
    }

    function createPhotoCard(evt) {
      const card = document.createElement('article');
      card.className = 'photo-card';

      const validDrive = sanitizeUrl(evt.drive_url);
      const validFlyer = sanitizeUrl(evt.flyer_url);

      const flyerWrap = document.createElement('div');
      flyerWrap.className = 'photo-flyer-wrap';

      if (validFlyer) {
        const img = document.createElement('img');
        img.className = 'photo-flyer-img';
        img.src = validFlyer;
        img.alt = `Fotos de ${evt.title}`;
        img.loading = 'lazy';
        flyerWrap.appendChild(img);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'card-flyer-placeholder';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('fill', 'none');
        svg.innerHTML = '<path d="M50 10L16 88H84L50 10Z" stroke="currentColor" stroke-width="5"/><polygon points="50,65 38,88 62,88" fill="currentColor"/>';
        placeholder.appendChild(svg);
        flyerWrap.appendChild(placeholder);
      }

      if (!validDrive) {
        // Estado: Revelando fotos…
        card.classList.add('photo-card-developing');

        const devBadge = document.createElement('div');
        devBadge.className = 'developing-badge';

        const t = document.createElement('span');
        t.className = 'developing-title';
        t.textContent = 'Revelando fotos…';
        devBadge.appendChild(t);

        const daysAgo = Math.max(1, Math.floor((Date.now() - new Date(evt.event_date).getTime()) / (1000 * 3600 * 24)));
        const st = document.createElement('span');
        st.className = 'developing-subtitle';
        st.textContent = `hace ${daysAgo} ${daysAgo === 1 ? 'día' : 'días'}`;
        devBadge.appendChild(st);

        flyerWrap.appendChild(devBadge);
      } else {
        // Estado: Fotos listas
        card.classList.add('photo-card-ready');
      }

      card.appendChild(flyerWrap);

      const body = document.createElement('div');
      body.className = 'photo-card-body';

      const title = document.createElement('h4');
      title.className = 'photo-card-title';
      title.textContent = evt.title;
      body.appendChild(title);

      const dateP = document.createElement('p');
      dateP.className = 'photo-card-date';
      const destText = evt.destination ? ` · ${evt.destination}` : '';
      dateP.textContent = `${formatFlyerDate(evt.event_date)}${destText}`;
      body.appendChild(dateP);

      if (validDrive) {
        const btn = document.createElement('a');
        btn.className = 'btn-drive';
        btn.href = validDrive;
        btn.target = '_blank';
        btn.rel = 'noopener noreferrer';
        btn.textContent = 'Ver fotos';
        body.appendChild(btn);
      }

      card.appendChild(body);
      return card;
    }
  </script>
